name: iOS

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release
        required: true
        type: boolean
        default: false
      tag_name:
        description: Release tag, leave empty to use the app version
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -quiet \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17e,OS=latest" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:TypeTypeIOSTests \
            -resultBundlePath build/TypeTypeIOSTests.xcresult

      - name: Build release
        run: |
          xcodebuild build \
            -quiet \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: build/TypeTypeIOSTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release }}
    runs-on: macos-26-intel
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: |
          if [[ -d /Applications/Xcode_26.5.app ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.5.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Prepare release metadata
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="$(
            sed -nE \
              's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"]+)"?/\1/p' \
              project.yml
          )"
          test -n "$version"
          expected_tag="v$version"
          release_tag="${INPUT_TAG_NAME:-$expected_tag}"
          test "$release_tag" = "$expected_tag"
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_BUILD=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Generate project
        run: xcodegen generate

      - name: Archive unsigned application
        run: |
          xcodebuild archive \
            -quiet \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Release \
            -archivePath build/TypeTypeIOS.xcarchive \
            -destination "generic/platform=iOS" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package release
        run: |
          app="build/TypeTypeIOS.xcarchive/Products/Applications/TypeTypeIOS.app"
          info="$app/Info.plist"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")"
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")"
          test "$app_version" = "$RELEASE_VERSION"
          test "$app_build" = "$RELEASE_BUILD"

          payload="build/Payload"
          asset="TypeTypeIOS-$RELEASE_TAG.ipa"
          mkdir -p "$payload" artifacts
          cp -R "$app" "$payload/TypeTypeIOS.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$payload" "artifacts/$asset"
          (
            cd artifacts
            shasum -a 256 "$asset" > "$asset.sha256"
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typetype-ios-release
          path: |
            artifacts/*.ipa
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="artifacts/TypeTypeIOS-$RELEASE_TAG.ipa"
          checksum="$asset.sha256"
          notes="Unsigned IPA for sideloading. Version $RELEASE_VERSION, build $RELEASE_BUILD, source $GITHUB_SHA."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$asset" "$checksum" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$asset" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --notes "$notes"
          fi
