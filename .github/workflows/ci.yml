name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Run tests (iOS Simulator)
        run: |
          xcodebuild \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build app (iOS Simulator)
        run: |
          xcodebuild \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
