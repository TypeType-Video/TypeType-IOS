name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (example: v0.1.0)"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="edge"
          fi

          if [ "$VERSION" != "edge" ] && ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version tag: $VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive app (Release, iOS)
        run: |
          xcodebuild \
            -project TypeTypeIOS.xcodeproj \
            -scheme TypeTypeIOS \
            -configuration Release \
            -archivePath build/TypeTypeIOS.xcarchive \
            -destination "generic/platform=iOS" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA asset
        id: package
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          APP_PATH="build/TypeTypeIOS.xcarchive/Products/Applications/TypeTypeIOS.app"
          PAYLOAD_DIR="build/Payload"
          ASSET_NAME="TypeTypeIOS-${VERSION}.ipa"
          if [ "$VERSION" = "edge" ]; then
            ASSET_NAME="TypeTypeIOS-edge.ipa"
          fi
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/TypeTypeIOS.app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_DIR" "artifacts/$ASSET_NAME"
          echo "asset=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ASSET="artifacts/${{ steps.package.outputs.asset }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber
          else
            if [ "$VERSION" = "edge" ]; then
              gh release create "$VERSION" "$ASSET" --title "edge" --prerelease --notes "Automated build from main branch"
            else
              gh release create "$VERSION" "$ASSET" --title "$VERSION" --generate-notes
            fi
          fi
