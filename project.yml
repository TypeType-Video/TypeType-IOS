name: TypeTypeIOS
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  TypeTypeIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOS/App
      - TypeTypeIOS/Core
      - TypeTypeIOS/DesignSystem
      - TypeTypeIOS/Features
      - TypeTypeIOS/MockData
      - TypeTypeIOS/Resources
    info:
      path: TypeTypeIOS/Info.plist
      properties:
        CFBundleDisplayName: TypeType
        NSLocalNetworkUsageDescription: TypeType connects to self-hosted instances on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.typetype.ios.oidc
            CFBundleURLSchemes:
              - typetype
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.ios
        PRODUCT_NAME: TypeTypeIOS

  TypeTypeIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSTests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  TypeTypeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSUITests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  TypeTypeIOSLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSLiveUITests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  TypeTypeIOS:
    build:
      targets:
        TypeTypeIOS: all
    test:
      targets:
        - TypeTypeIOSTests
        - TypeTypeIOSUITests

  TypeTypeIOSLive:
    build:
      targets:
        TypeTypeIOS: all
    run:
      config: Debug
      commandLineArguments:
        "--typetype-live-ui": true
    test:
      targets:
        - TypeTypeIOSLiveUITests
