name: TypeTypeIOS
options:
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  TypeTypeIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOS/App
      - TypeTypeIOS/Core
      - TypeTypeIOS/DesignSystem
      - TypeTypeIOS/Features
      - TypeTypeIOS/MockData
      - path: TypeTypeIOS/Resources
        excludes:
          - AppIcon.icon
      - path: TypeTypeIOS/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: TypeTypePlayerKit
    info:
      path: TypeTypeIOS/Info.plist
      properties:
        CFBundleDisplayName: TypeType
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: TypeType connects to self-hosted instances on your local network and sends videos to AirPlay devices.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.typetype.ios.oidc
            CFBundleURLSchemes:
              - typetype
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.typetype.ios.notifications-refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 24
        ENABLE_DEBUG_DYLIB: NO
        MARKETING_VERSION: 0.8.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.ios
        PRODUCT_NAME: TypeTypeIOS
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "Demo*.swift TypeTypeDemoAppView.swift MockAppConfiguration.swift"

  TypeTypePlayerKit:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypePlayerKit
    settings:
      base:
        PRODUCT_NAME: TypeTypePlayerKit

  TypeTypePlayerKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypePlayerKitTests
    dependencies:
      - target: TypeTypePlayerKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.playerkit.tests
        PRODUCT_NAME: TypeTypePlayerKitTests

  TypeTypeIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSTests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.ios.tests
        PRODUCT_NAME: TypeTypeIOSTests

  TypeTypeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSUITests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.ios.uitests
        PRODUCT_NAME: TypeTypeIOSUITests

  TypeTypeIOSLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - TypeTypeIOSLiveUITests
    dependencies:
      - target: TypeTypeIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: dev.typetype.ios.live-uitests
        PRODUCT_NAME: TypeTypeIOSLiveUITests

schemes:
  TypeTypeIOS:
    build:
      targets:
        TypeTypeIOS: all
    test:
      targets:
        - TypeTypeIOSTests
        - TypeTypePlayerKitTests
        - TypeTypeIOSUITests

  TypeTypeIOSUnit:
    build:
      targets:
        TypeTypeIOS: all
    test:
      targets:
        - TypeTypeIOSTests
        - TypeTypePlayerKitTests

  TypeTypeIOSLive:
    build:
      targets:
        TypeTypeIOS: all
    run:
      config: Debug
      commandLineArguments:
        "--typetype-live-ui": true
    test:
      targets:
        - TypeTypeIOSLiveUITests
